replicaCount: 2

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.eu-central-1.amazonaws.com/lesson-7-django
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

config:
  POSTGRES_DB: myproject_db
  POSTGRES_USER: myuser
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "*"

secrets:
  POSTGRES_PASSWORD: ""
  DJANGO_SECRET_KEY: ""

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70