replicaCount: 2

image:
  repository: 634222035653.dkr.ecr.eu-central-1.amazonaws.com/lesson-7-django
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

config:
  POSTGRES_DB: myproject_db
  POSTGRES_USER: myuser
  POSTGRES_PASSWORD: mypassword
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  DJANGO_SECRET_KEY: django-insecure-change-me-in-production
  DJANGO_DEBUG: "1"
  DJANGO_ALLOWED_HOSTS: "*"

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70